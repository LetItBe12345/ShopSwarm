<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>ShopSwarm browser actions</title>
    <style>body { min-height: 1400px; }</style>
  </head>
  <body>
    <main>
      <h1>商品测试页</h1>
      <label>查询商品 <input id="query" aria-label="查询商品"></label>
      <button id="search" type="button">搜索</button>
      <label>
        容量
        <select id="capacity" aria-label="容量">
          <option value="1TB">1TB</option>
          <option value="2TB">2TB</option>
        </select>
      </label>
      <h2 id="result">尚未搜索</h2>
      <h2 id="selected">已选 1TB</h2>
      <a href="/next">查看详情</a>
    </main>
    <script>
      document.querySelector('#search').addEventListener('click', () => {
        document.querySelector('#result').textContent = `搜索结果：${document.querySelector('#query').value}`
      })
      document.querySelector('#capacity').addEventListener('change', event => {
        document.querySelector('#selected').textContent = `已选 ${event.target.value}`
      })
    </script>
  </body>
</html>
