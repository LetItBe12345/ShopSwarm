<text x="944" y="2101" font-size="18" fill="#52647b" font-weight="400">Disclose gaps; no fixed field gate. No buying, paying or bypassing protections</text>
<text x="60" y="2194" font-size="17" fill="#64758d" font-weight="400">Sources: current code, design document and shopping-research Skill. Historical helpers are outside this tool path.</text>
