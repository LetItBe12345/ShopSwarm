<text x="84" y="2069" font-size="18" fill="#52647b" font-weight="400">Tool close / Cancel / Unload / 15-min idle timeout → Clean up and release slot</text>
<text x="84" y="2101" font-size="18" fill="#52647b" font-weight="400">Strip inherited proxy, Profile, CDP and foreground settings; serialize CLI / tool use</text>
